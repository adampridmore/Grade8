<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitch Test</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { justify-content: center; gap: 1.5rem; }

        .key-display {
            font-size: 1.2rem;
            font-weight: bold;
        }

        #playStatus {
            color: #888;
            font-size: 0.85rem;
            min-height: 1.2em;
        }

        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 8px;
            color: #eee;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0.6rem 1.2rem;
            transition: all 0.15s ease;
        }

        button:not([disabled]):hover {
            border-color: #e94560;
            background: #1f2d50;
        }

        .hint {
            color: #666;
            font-size: 0.75rem;
            text-align: center;
            max-width: 420px;
        }

        .answer-box {
            width: 100%;
            max-width: 720px;
            overflow-x: auto;
        }

        .tab {
            font-family: 'Courier New', monospace;
            font-size: 15px;
            line-height: 1.5;
            white-space: pre;
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 8px;
            padding: 0.9rem 1rem;
            color: #eee;
        }

        .legend {
            color: #666;
            font-size: 0.75rem;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <a class="home-link" href="index.html">&larr; Home</a>
    <h1>Pitch Test</h1>
    <p class="subtitle">Listen to the 4-bar phrase, then reveal the answer to check yourself</p>
    <p id="status">Loading samples&hellip;</p>

    <p class="key-display" id="keyDisplay"></p>
    <p id="playStatus"></p>

    <div class="controls">
        <button id="playBtn" disabled>Play</button>
        <button id="revealBtn">Reveal</button>
        <button id="newTestBtn" disabled>New Test</button>
    </div>

    <p class="hint">Bars 1 and 3 are always identical. Try to sing or play the phrase back before revealing.</p>

    <div class="answer-box" id="answerBox" hidden></div>

    <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
    <script>
        // ── Music data ────────────────────────────────────────────

        // Standard tuning, low to high (matches fretboard.html)
        const GUITAR_STRINGS = [
            { label: 'E', openMidi: 40 },
            { label: 'A', openMidi: 45 },
            { label: 'D', openMidi: 50 },
            { label: 'G', openMidi: 55 },
            { label: 'B', openMidi: 59 },
            { label: 'e', openMidi: 64 },
        ];

        // Major scale semitone offsets, degree 1..8 (8 = octave)
        const MAJOR_SCALE_INTERVALS = [0, 2, 4, 5, 7, 9, 11, 12];

        // 12 major keys, one per pitch class, with conventional diatonic spelling
        const KEYS = [
            { name: 'C major',  tonicPc: 0,  names: ['C', 'D', 'E', 'F', 'G', 'A', 'B'] },
            { name: 'G major',  tonicPc: 7,  names: ['G', 'A', 'B', 'C', 'D', 'E', 'F#'] },
            { name: 'D major',  tonicPc: 2,  names: ['D', 'E', 'F#', 'G', 'A', 'B', 'C#'] },
            { name: 'A major',  tonicPc: 9,  names: ['A', 'B', 'C#', 'D', 'E', 'F#', 'G#'] },
            { name: 'E major',  tonicPc: 4,  names: ['E', 'F#', 'G#', 'A', 'B', 'C#', 'D#'] },
            { name: 'B major',  tonicPc: 11, names: ['B', 'C#', 'D#', 'E', 'F#', 'G#', 'A#'] },
            { name: 'F# major', tonicPc: 6,  names: ['F#', 'G#', 'A#', 'B', 'C#', 'D#', 'E#'] },
            { name: 'Db major', tonicPc: 1,  names: ['Db', 'Eb', 'F', 'Gb', 'Ab', 'Bb', 'C'] },
            { name: 'Ab major', tonicPc: 8,  names: ['Ab', 'Bb', 'C', 'Db', 'Eb', 'F', 'G'] },
            { name: 'Eb major', tonicPc: 3,  names: ['Eb', 'F', 'G', 'Ab', 'Bb', 'C', 'D'] },
            { name: 'Bb major', tonicPc: 10, names: ['Bb', 'C', 'D', 'Eb', 'F', 'G', 'A'] },
            { name: 'F major',  tonicPc: 5,  names: ['F', 'G', 'A', 'Bb', 'C', 'D', 'E'] },
        ];

        const TIME_SIGS = ['3/4', '4/4', '6/8'];

        // Rhythm cells, expressed in eighth-note units (1 = quaver, 2 = crotchet, 3 = dotted crotchet)
        const CELLS_2 = [[2], [1, 1]];
        const CELLS_3 = [[3], [2, 1], [1, 2], [1, 1, 1]];

        const EIGHTH = 0.3; // seconds per eighth-note unit

        // ── State ─────────────────────────────────────────────────

        let guitar = null;
        let ac = null;
        let busy = false;
        let current = null; // { key, timeSig, degreeMap, tonicMidi, bar1, bar2, bar4 } (bar3 === bar1)

        const statusEl     = document.getElementById('status');
        const keyDisplayEl = document.getElementById('keyDisplay');
        const playStatusEl = document.getElementById('playStatus');
        const playBtn      = document.getElementById('playBtn');
        const revealBtn    = document.getElementById('revealBtn');
        const newTestBtn   = document.getElementById('newTestBtn');
        const answerBox    = document.getElementById('answerBox');

        // ── Generation ────────────────────────────────────────────

        // Maps each scale degree (0..7, tonic..octave) to a fixed (string, fret),
        // all within a single 5-fret window so the fretting hand never has to
        // shift position to play the phrase. Searches for the lowest such window
        // (starting above the open strings) that can reach every degree.
        const WINDOW_WIDTH = 5;
        const MAX_FRET_SEARCH = 10;

        function tryBuildWindowMap(tonicMidi, windowStart) {
            const map = {};
            let prevStringIdx = 0;
            for (let d = 0; d <= 7; d++) {
                const targetMidi = tonicMidi + MAJOR_SCALE_INTERVALS[d];
                let found = null;
                // prefer a string at or above the previous note's, for a smooth
                // low-to-high fingering shape; fall back to any string that fits
                for (const s of [...range(prevStringIdx, GUITAR_STRINGS.length), ...range(0, prevStringIdx)]) {
                    const fret = targetMidi - GUITAR_STRINGS[s].openMidi;
                    if (fret >= windowStart && fret <= windowStart + WINDOW_WIDTH - 1) {
                        found = { stringIdx: s, fret };
                        break;
                    }
                }
                if (!found) return null;
                map[d] = found;
                prevStringIdx = found.stringIdx;
            }
            return map;
        }

        function range(from, to) {
            const out = [];
            for (let i = from; i < to; i++) out.push(i);
            return out;
        }

        function buildDegreeMap(tonicPc) {
            for (let fret = 1; fret <= MAX_FRET_SEARCH; fret++) {
                for (let stringIdx = 0; stringIdx < GUITAR_STRINGS.length; stringIdx++) {
                    if ((GUITAR_STRINGS[stringIdx].openMidi + fret) % 12 !== tonicPc) continue;
                    const tonicMidi = GUITAR_STRINGS[stringIdx].openMidi + fret;
                    for (let windowStart = Math.max(1, fret - (WINDOW_WIDTH - 1)); windowStart <= fret; windowStart++) {
                        const map = tryBuildWindowMap(tonicMidi, windowStart);
                        if (map) return { map, tonicMidi };
                    }
                }
            }
            throw new Error('No 5-fret position found for pitch class ' + tonicPc);
        }

        function generateDegreeSequence(n) {
            const starts = [0, 2, 4]; // 1st, 3rd, 5th degree (0-based index)
            let cur = starts[Math.floor(Math.random() * starts.length)];
            const seq = [cur];
            for (let i = 1; i < n; i++) {
                let delta;
                if (Math.random() < 0.75) {
                    delta = Math.random() < 0.5 ? -1 : 1;
                } else {
                    const leap = Math.random() < 0.5 ? 2 : 3;
                    delta = Math.random() < 0.5 ? -leap : leap;
                }
                let next = cur + delta;
                if (next < 0 || next > 7) next = cur - delta;
                if (next < 0 || next > 7) next = cur;
                seq.push(next);
                cur = next;
            }
            return seq;
        }

        function generateBarRhythm(timeSig) {
            const groups = timeSig === '6/8' ? [3, 3] : (timeSig === '4/4' ? [2, 2, 2, 2] : [2, 2, 2]);
            const units = [];
            groups.forEach(size => {
                const pool = size === 3 ? CELLS_3 : CELLS_2;
                units.push(...pool[Math.floor(Math.random() * pool.length)]);
            });
            return units;
        }

        function generateTest() {
            const key = KEYS[Math.floor(Math.random() * KEYS.length)];
            const timeSig = TIME_SIGS[Math.floor(Math.random() * TIME_SIGS.length)];
            const { map: degreeMap, tonicMidi } = buildDegreeMap(key.tonicPc);

            const bar1Durations = generateBarRhythm(timeSig);
            const bar2Durations = generateBarRhythm(timeSig);
            const bar4Durations = generateBarRhythm(timeSig);

            const degrees = generateDegreeSequence(bar1Durations.length + bar2Durations.length + bar4Durations.length);
            const bar1Degrees = degrees.slice(0, bar1Durations.length);
            const bar2Degrees = degrees.slice(bar1Durations.length, bar1Durations.length + bar2Durations.length);
            const bar4Degrees = degrees.slice(bar1Durations.length + bar2Durations.length);

            const toBar = (durations, degs) => durations.map((dur, i) => ({ dur, degree: degs[i] }));

            return {
                key,
                timeSig,
                degreeMap,
                tonicMidi,
                bar1: toBar(bar1Durations, bar1Degrees),
                bar2: toBar(bar2Durations, bar2Degrees),
                bar4: toBar(bar4Durations, bar4Degrees),
            };
        }

        // ── Playback ──────────────────────────────────────────────

        function noteMidi(test, degree) {
            return test.tonicMidi + MAJOR_SCALE_INTERVALS[degree];
        }

        function schedulePhrase(test, startTime) {
            let t = startTime;
            [test.bar1, test.bar2, test.bar1, test.bar4].forEach(bar => {
                bar.forEach(({ dur, degree }) => {
                    guitar.play(noteMidi(test, degree), ac.currentTime + t, { gain: 1.3 });
                    t += dur * EIGHTH;
                });
            });
            return t; // end time (relative offset)
        }

        function playPhraseAudio(test) {
            if (!guitar || !ac || busy) return;
            if (ac.state === 'suspended') ac.resume();
            busy = true;
            refreshControls();
            playStatusEl.textContent = 'Playing…';

            const t = schedulePhrase(test, 0);

            setTimeout(() => {
                busy = false;
                refreshControls();
                playStatusEl.textContent = 'Ready';
            }, t * 1000);
        }

        function refreshControls() {
            newTestBtn.disabled = busy;
            playBtn.disabled = busy || !current;
        }

        // ── UI ────────────────────────────────────────────────────

        function startNewTest() {
            current = generateTest();
            keyDisplayEl.textContent = `Key: ${current.key.name} — Time: ${current.timeSig}`;
            answerBox.hidden = true;
            answerBox.innerHTML = '';
            playStatusEl.textContent = 'Press Play to begin';
            refreshControls();
        }

        function playPhrase() {
            if (!current) return;
            playPhraseAudio(current);
        }

        // Renders the phrase as a rhythm line above a 6-line ASCII tab, e.g.:
        //     ♩   ♩   ♪ ♪ | ♩.    ♪ | ...
        //   e|-----------2-4-5--------------------------------
        //   B|-----2-3-5--------------------------------------
        //   G|-2-4--------------------------------------------
        //   D|--------------------------------------------------
        //   A|--------------------------------------------------
        //   E|--------------------------------------------------
        // The rhythm line and tab rows are built column-by-column together so
        // a note's duration symbol always lines up with its fret number.
        const STRING_ORDER_HIGH_TO_LOW = [5, 4, 3, 2, 1, 0]; // e,B,G,D,A,E
        const DURATION_SYMBOL = { 1: '♪', 2: '♩', 3: '♩.' }; // quaver, crotchet, dotted crotchet

        function buildAnswer(test) {
            const tabRows = STRING_ORDER_HIGH_TO_LOW.map(() => []);
            const rhythmRow = [];

            function appendColumn(tabChar, tabRowIdx, rhythmChar) {
                tabRows.forEach((row, i) => row.push(i === tabRowIdx ? tabChar : '-'));
                rhythmRow.push(rhythmChar);
            }

            function appendBarLine() {
                tabRows.forEach(row => row.push('|'));
                rhythmRow.push('|');
            }

            function appendNote(stringIdx, fret, dur) {
                const rowIdx = STRING_ORDER_HIGH_TO_LOW.indexOf(stringIdx);
                const fretChars = String(fret).split('');
                const symbolChars = DURATION_SYMBOL[dur].split('');
                const width = Math.max(dur * 2, fretChars.length + 1, symbolChars.length + 1);
                for (let col = 0; col < width; col++) {
                    appendColumn(
                        col < fretChars.length ? fretChars[col] : '-',
                        rowIdx,
                        col < symbolChars.length ? symbolChars[col] : ' '
                    );
                }
            }

            const bars = [test.bar1, test.bar2, test.bar1, test.bar4];
            bars.forEach((bar, bi) => {
                appendColumn('-', -1, ' ');
                bar.forEach(({ dur, degree }) => {
                    const { stringIdx, fret } = test.degreeMap[degree];
                    appendNote(stringIdx, fret, dur);
                });
                if (bi < bars.length - 1) appendBarLine();
            });

            const tabLines = STRING_ORDER_HIGH_TO_LOW
                .map((stringIdx, i) => `${GUITAR_STRINGS[stringIdx].label}|${tabRows[i].join('')}`);
            const rhythmLine = `  ${rhythmRow.join('')}`;

            return [rhythmLine, ...tabLines].join('\n');
        }

        const TAB_BASE_FONT_PX = 15;
        const TAB_MIN_FONT_PX = 9;

        // Shrinks the tab's font just enough to fit the answer box's width,
        // so it displays fully without needing to scroll (falls back to
        // scrolling only if it would otherwise need to shrink unreadably small).
        function fitTabToWidth(pre) {
            pre.style.fontSize = TAB_BASE_FONT_PX + 'px';
            const available = answerBox.clientWidth;
            const needed = pre.scrollWidth;
            if (needed > available) {
                const scaled = Math.max(TAB_MIN_FONT_PX, Math.floor(TAB_BASE_FONT_PX * (available / needed) * 0.98));
                pre.style.fontSize = scaled + 'px';
            }
        }

        function reveal() {
            if (!current) return;
            const pre = document.createElement('pre');
            pre.className = 'tab';
            pre.textContent = buildAnswer(current);

            const legend = document.createElement('p');
            legend.className = 'legend';
            legend.textContent = '♪ quaver   ♩ crotchet   ♩. dotted crotchet';

            answerBox.innerHTML = '';
            answerBox.appendChild(pre);
            answerBox.appendChild(legend);
            answerBox.hidden = false;

            fitTabToWidth(pre);
            playStatusEl.textContent = 'Revealed';
        }

        newTestBtn.addEventListener('click', startNewTest);
        playBtn.addEventListener('click', playPhrase);
        revealBtn.addEventListener('click', reveal);

        // ── Audio loading ─────────────────────────────────────────

        function loadSamples() {
            ac = new (window.AudioContext || window.webkitAudioContext)();
            Soundfont.instrument(ac, 'acoustic_guitar_steel', {
                soundfont: 'FluidR3_GM',
                nameToUrl: (name, sf) =>
                    `https://gleitz.github.io/midi-js-soundfonts/${sf}/${name}-mp3.js`
            }).then(instrument => {
                guitar = instrument;
                statusEl.textContent = 'Samples ready';
                statusEl.classList.add('ready');
                playStatusEl.textContent = 'Press New Test to begin';
                refreshControls();
            }).catch(() => {
                statusEl.textContent = 'Click anywhere to load samples…';
                document.addEventListener('click', loadSamples, { once: true });
            });
        }

        window.addEventListener('load', loadSamples);
        window.addEventListener('resize', () => {
            if (!answerBox.hidden) fitTabToWidth(answerBox.querySelector('.tab'));
        });
    </script>
</body>
</html>
